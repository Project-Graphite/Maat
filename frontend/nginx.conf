map $request_uri $logged_uri {
    ~^(?<before_token>.*/reset-password/)[^/?]+ "${before_token}[redacted]";
    default $request_uri;
}

log_format redacted '$proxy_add_x_forwarded_for [$time_local] "$request_method $logged_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:5000 resolve;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log redacted;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/xml text/xml image/svg+xml application/manifest+json;

    location /api/v1/auth/reset-password/ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location = /sitemap-problems.xml {
        proxy_pass http://backend;
    }

    location = /health {
        proxy_pass http://backend;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
