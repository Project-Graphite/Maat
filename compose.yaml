x-logging: &logging
  driver: json-file
  # Logs hold IP addresses, so they are rotated instead of kept forever
  options:
    max-size: 10m
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: maat
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
      - ./infra/minio/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:72f9978d415ea8294d78051fb3aee2fd258d449237633f77f100b5367bb5225d
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_LOCAL: mongodb://maat:${MONGO_PASSWORD}@mongo:27017/maat?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      API_RATE_LIMIT: ${API_RATE_LIMIT:?set API_RATE_LIMIT in .env}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  worker:
    build: ./worker
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_LOCAL: mongodb://maat:${MONGO_PASSWORD}@mongo:27017/maat?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JOBS_DIR: /opt/maat-jobs
      SANDBOX_CPUSET: ${SANDBOX_CPUSET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/maat-jobs:/opt/maat-jobs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  sandbox-cpp:
    build:
      context: ./worker/sandbox-images
      dockerfile: cpp.Dockerfile
    image: maat-cpp
    profiles: ["build"]

  sandbox-python:
    build:
      context: ./worker/sandbox-images
      dockerfile: python.Dockerfile
    image: maat-python
    profiles: ["build"]

volumes:
  mongo-data:
  redis-data:
  minio-data: